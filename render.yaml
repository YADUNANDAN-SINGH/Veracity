# Render Blueprint for the hosted judge build (Render dashboard → New → Blueprint → this repo).
# Render asks for the values marked sync: false when the Blueprint is created.
# A paid instance ($7/month, billed by the second) so judges never wait for a sleeping
# service, with a 1 GB disk ($0.25/month) so held payments and reports survive restarts
# and redeploys. Delete the service after judging to stop the bill.
services:
  - type: web
    name: veracity
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: veracity-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: VERA_MODE
        value: judge
      - key: VERA_REGION
        value: US
      - key: VERA_DB
        value: /var/data/veracity.db
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Webhook URL to register in the PayPal app: https://<your-service>.onrender.com/api/paypal/webhook
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # A sandbox personal account judges can log in to PayPal with (shown on the dashboard)
      - key: VERA_SANDBOX_BUYER_EMAIL
        sync: false
      - key: VERA_SANDBOX_BUYER_PASSWORD
        sync: false
