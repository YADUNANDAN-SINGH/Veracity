services:
  backend:
    build: ./veracity-backend
    ports:
      - "8000:8000"

  # Production-style dashboard: nginx serves the build and proxies /api + /ws to the backend.
  # docker compose up --build  → http://localhost:5173
  frontend:
    build:
      context: ./veracity-frontend/veracity
      target: prod
    environment:
      # Real phone: run the backend on the Mac (Docker can't see USB) and start with
      # BACKEND_URL=http://host.docker.internal:8000 docker compose up -d --no-deps frontend
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Hot-reload dashboard for frontend work (edits in src/ show up instantly).
  # docker compose --profile dev up --build backend frontend-dev  → http://localhost:5174
  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./veracity-frontend/veracity
      target: dev
    environment:
      VITE_BACKEND_URL: http://backend:8000
    ports:
      - "5174:5173"
    volumes:
      - ./veracity-frontend/veracity:/app
      - /app/node_modules # keep the container's Linux node_modules, not the Mac's
    depends_on:
      - backend

  # The full judge build (Dockerfile.judge): the real models, so judges can upload
  # their own call recording. Name the service so the services above don't start too
  # (backend also uses port 8000):
  #   cp .env.example .env    # PayPal sandbox keys, optional
  #   docker compose --profile judge up --build judge  → http://localhost:8000
  # Without a .env it still starts: .env.example is read first, and a .env overrides it.
  # Reachable from this machine only: call audio and transcripts stay on it.
  judge:
    profiles: ["judge"]
    build:
      context: .
      dockerfile: Dockerfile.judge
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      VERA_DB: /data/veracity.db # reports, community reports and held payments survive a restart
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - judge-data:/data

volumes:
  judge-data:
